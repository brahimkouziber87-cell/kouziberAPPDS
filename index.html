    <script>
      // Filter out non-fatal WebSocket / HMR messages in AI Studio preview sandbox
      (function() {
        var isWsError = function(val) {
          if (!val) return false;
          var str = '';
          try {
            if (typeof val === 'string') str = val;
            else if (val.message) str = val.message;
            else if (val.stack) str = val.stack;
            else str = String(val);
          } catch (e) {
            return false;
          }
          return (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('websocket') !== -1 ||
            str.indexOf('[vite]') !== -1 ||
            str.indexOf('closed without opened') !== -1
          );
        };

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isWsError(arguments[i])) return;
          }
          return origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isWsError(arguments[i])) return;
          }
          return origWarn.apply(console, arguments);
        };

        window.onerror = function(msg, url, line, col, error) {
          if (isWsError(msg) || isWsError(error) || (url && url.indexOf('@vite/client') !== -1)) {
            return true;
          }
        };

        window.addEventListener('error', function(event) {
          if (isWsError(event.message) || isWsError(event.error) || (event.filename && event.filename.indexOf('@vite/client') !== -1)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isWsError(event.reason)) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        // Intercept Vite HMR WebSocket in preview iframe so it never fires 'WebSocket closed without opened'
        if (typeof window.WebSocket !== 'undefined') {
          var OrigWebSocket = window.WebSocket;
          var MockWebSocket = function(url, protocols) {
            var isViteHmr =
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              (typeof url === 'string' && url.indexOf('vite-hmr') !== -1);

            if (isViteHmr) {
              return {
                url: url || '',
                protocol: 'vite-hmr',
                readyState: 1, // OPEN
                bufferedAmount: 0,
                extensions: '',
                binaryType: 'blob',
                onopen: null,
                onerror: null,
                onclose: null,
                onmessage: null,
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return true; },
                send: function() {},
                close: function() {}
              };
            }

            var ws = protocols !== undefined ? new OrigWebSocket(url, protocols) : new OrigWebSocket(url);
            var hasOpened = false;
            ws.addEventListener('open', function() {
              hasOpened = true;
            });

            var origAddEventListener = ws.addEventListener;
            ws.addEventListener = function(type, listener, options) {
              if (type === 'close') {
                var safeClose = function() {
                  if (!hasOpened) return;
                  try {
                    return listener.apply(this, arguments);
                  } catch (err) {}
                };
                return origAddEventListener.call(this, type, safeClose, options);
              }
              if (type === 'error') {
                var safeError = function() {
                  if (!hasOpened) return;
                  try {
                    return listener.apply(this, arguments);
                  } catch (err) {}
                };
                return origAddEventListener.call(this, type, safeError, options);
              }
              return origAddEventListener.apply(this, arguments);
            };
            return ws;
          };
          MockWebSocket.prototype = OrigWebSocket.prototype;
          MockWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          MockWebSocket.OPEN = OrigWebSocket.OPEN;
          MockWebSocket.CLOSING = OrigWebSocket.CLOSING;
          MockWebSocket.CLOSED = OrigWebSocket.CLOSED;
          window.WebSocket = MockWebSocket;
        }
      })();
    </script>
